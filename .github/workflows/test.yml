name: Tests

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # Weekly Monday, so a yt-dlp or vendor change shows up without a push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install yt-dlp and pytest
        run: python -m pip install --quiet yt-dlp pytest
      - name: Run the test suite
        run: python -m pytest

  fresh-e2e:
    name: Fresh end-to-end video run
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install ffmpeg and whisper.cpp
        run: brew install ffmpeg whisper-cpp
      - name: Install yt-dlp
        run: python -m pip install --quiet yt-dlp
      - name: Download the smallest whisper.cpp model
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ggml-tiny.en.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Run the pipeline on a real public-domain video
        env:
          PYTHON: python
          REQUIRE_LOCAL_WHISPER: '1'
        run: WHISPER_CPP_MODEL="$RUNNER_TEMP/ggml-tiny.en.bin" bash tests/e2e/fresh_watch.sh
